name: Update Competitions

on:
  schedule:
    # Runs daily at 2 AM UK time
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-competitions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run competitions fetcher
        run: node fetch-competitions.js
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions@github.com'
          git add data/competitions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🏆 Update competitions data" && git push)
