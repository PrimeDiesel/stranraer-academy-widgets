name: Vet and schedule daily picks

on:
  schedule:
    # 05:30 UK every day — regenerates today.json before pupils are up
    - cron: '30 5 * * *'
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  vet-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vet content, build schedules and today.json
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}   # optional; blank is fine
        run: node vet-and-schedule.js

      - name: Upload rejection report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-report
          path: data/rejected-report.json
          if-no-files-found: ignore

      - name: Commit caches, schedules and today.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: vet + schedule daily picks [skip ci]"
            git push
          fi
